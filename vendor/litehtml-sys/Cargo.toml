# Vendored, patched copy of the `litehtml-sys` crate (originally
# https://github.com/franzos/litehtml-rs, MIT). See vendor/PATCHES.md for
# what was changed and why.

[package]
edition = "2021"
name = "litehtml-sys"
version = "0.2.5"
authors = ["Franz Geffke <mail@gofranz.com>"]
build = "build.rs"
exclude = ["tests/"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Raw FFI bindings for litehtml (C++ HTML/CSS rendering engine)"
readme = "README.md"
keywords = [
    "litehtml",
    "html",
    "css",
    "ffi",
    "rendering",
]
categories = [
    "external-ffi-bindings",
    "rendering",
]
license = "MIT AND BSD-3-Clause AND Apache-2.0"
repository = "https://github.com/franzos/litehtml-rs"

[features]
buildtime-bindgen = ["bindgen"]
default = ["vendored"]
vendored = []

[lib]
name = "litehtml_sys"
path = "src/lib.rs"

[dependencies]

[build-dependencies.bindgen]
version = "0.71"
optional = true

[build-dependencies.cc]
version = "1"
