<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Newsletter</title>
	<style>
		body {
			font: 100% / 1.5 sans-serif;
			background-color: #fff;
			color: #000;
		}

		:focus-visible {
			outline: 3px solid #1a73e8;
		}
	</style>
</head>
<body>
	<a href="#main-content">Skip to main content</a>

	<main id="main-content">
		<h1>Newsletter</h1>

		<img src="newsletter-banner.gif" alt="Free newsletter. Get free recipes, news, and more.">

		<form>
			<label for="email">Email address</label>
			<input type="email" id="email" name="email" autocomplete="email">
			<button type="submit">Subscribe</button>
		</form>

		<p style="color: #999999; background-color: #ffffff">
			By subscribing you agree to our terms.
		</p>

		<button style="width: 16px; height: 16px" aria-label="Close">x</button>

		<p><a href="/privacy-policy">Read our Privacy Policy</a></p>
	</main>
</body>
</html>
