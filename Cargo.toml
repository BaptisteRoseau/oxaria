[package]
name = "oxaria"
version = "0.1.0"
edition = "2024"
description = "Check a web page against a curated set of accessibility rules such as WCAG 2.2, WAI-ARIA 1.2, ARIA in HTML and ACT."
# The package bundles litehtml (BSD-3-Clause) and its gumbo parser (Apache-2.0).
license = "MIT AND BSD-3-Clause AND Apache-2.0"
repository = "https://github.com/BaptisteRoseau/oxaria"
readme = "README.md"
keywords = ["accessibility", "cli", "wcag", "ci", "web-development"]
include = [
    "/build.rs",
    "/src/",
    "/standards/*.md",
    "/tests/",
    "/vendor/PATCHES.md",
    "/vendor/litehtml-rs-LICENSE",
    "/vendor/litehtml_c/",
    "/vendor/litehtml/LICENSE",
    "/vendor/litehtml/include/",
    "/vendor/litehtml/src/",
    "/LICENSE",
    "/README.md",
]
categories = ["accessibility", "command-line-utilities", "web-programming", "development-tools::testing"]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
httpdate = "1.0.3"
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
rstest = "0.27.0"
scraper = "0.27.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util"] }
wiremock = "0.6.5"

[build-dependencies]
cc = "1.10.0"

[[bin]]
name = "oxaria"
path = "src/main.rs"
